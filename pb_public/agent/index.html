<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BharatYatra — Agent Dashboard</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#D97706">
  <link rel="stylesheet" href="/css/tailwind.css">

  <style>
    [x-cloak] { display: none !important; }
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt {
        position: absolute;
        left: 0;
        top: 0;
        width: 58mm;
        margin: 0;
        padding: 5px;
      }
    }
  </style>

  <!-- Offline Libraries -->
  <script src="/js/dexie.min.js"></script>
  <script src="/offline-store.js"></script>
  <script src="/agent/receipt.js"></script>
  <script src="/js/htmx.min.js"></script>
  <script defer src="/js/alpine.min.js"></script>
</head>
<body class="min-h-full flex flex-col font-sans antialiased pb-20 select-none" x-data="agentApp()" x-init="initApp()" x-cloak>

  <!-- Top App Bar -->
  <header class="sticky top-0 z-30 bg-slate-800/95 backdrop-blur border-b border-slate-700 px-4 py-3 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <a href="/" class="flex items-center">
          <img src="/images/logo.png" alt="Aditya Logo" class="h-9 w-auto object-contain filter drop-shadow rounded-lg p-0.5 bg-white/10" />
        </a>
        <div>
          <h1 class="text-sm font-bold tracking-tight text-white leading-tight">Aditya Travels</h1>
          <p class="text-[11px] text-amber-300/80" x-text="agentName || 'Field Sahayak'"></p>
        </div>
      </div>

      <!-- Sync Status & Action -->
      <div class="flex items-center space-x-2">
        <!-- Online/Offline Badge (AGNT-03) -->
        <div class="flex items-center px-2 py-1 rounded-full text-[11px] font-medium border"
             :class="isOnline ? 'bg-emerald-950/80 text-emerald-400 border-emerald-700/50' : 'bg-amber-950/80 text-amber-400 border-amber-700/50'">
          <span class="w-2 h-2 rounded-full mr-1.5" :class="isOnline ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'"></span>
          <span x-text="isOnline ? 'Online' : 'Offline'"></span>
        </div>

        <!-- Outbox Pill -->
        <template x-if="pendingSyncCount > 0">
          <span class="px-2 py-0.5 rounded-full text-[11px] bg-red-600 text-white font-bold" x-text="pendingSyncCount"></span>
        </template>

        <!-- Sync Button -->
        <button @click="syncData()" :disabled="isSyncing" class="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-slate-200 transition active:scale-95">
          <svg class="w-4 h-4" :class="isSyncing ? 'animate-spin text-amber-400' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto w-full px-4 pt-4 flex-1">

    <!-- Cash in Hand KPI Card (AGNT-05) -->
    <section class="bg-gradient-to-br from-amber-600 to-amber-700 rounded-2xl p-4 text-white shadow-lg mb-4">
      <div class="flex justify-between items-start">
        <div>
          <span class="text-xs font-semibold uppercase tracking-wider text-amber-100">Total Cash In Hand</span>
          <h2 class="text-3xl font-extrabold tracking-tight mt-1" x-text="'₹ ' + Number(cashInHand).toLocaleString('en-IN')"></h2>
          <p class="text-xs text-amber-100/90 mt-1" x-text="cashCollectionsCount + ' cash payment(s) awaiting handover'"></p>
        </div>
        <div class="p-2 bg-amber-500/30 rounded-xl">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path>
          </svg>
        </div>
      </div>

      <button @click="openHandoverModal()" :disabled="cashInHand <= 0"
              class="w-full mt-3.5 py-2.5 bg-slate-900/90 hover:bg-slate-900 disabled:opacity-50 text-amber-300 font-semibold text-xs rounded-xl shadow flex items-center justify-center space-x-2 transition active:scale-98">
        <span>Handover to Distributor</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
        </svg>
      </button>
    </section>

    <!-- Daily Recovery List Header (AGNT-01) -->
    <div class="flex items-center justify-between mb-3">
      <div>
        <h3 class="font-bold text-base text-white">Daily Recovery Route</h3>
        <p class="text-xs text-slate-400" x-text="recoveryList.length + ' customer(s) due'"></p>
      </div>

      <!-- Quick Search Filter -->
      <div class="relative w-36">
        <input type="text" x-model="searchQuery" placeholder="Search..."
               class="w-full text-xs bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500">
      </div>
    </div>

    <!-- Empty State -->
    <template x-if="filteredList.length === 0">
      <div class="bg-slate-800/60 rounded-2xl p-8 text-center border border-slate-700/60 mt-4">
        <div class="w-12 h-12 bg-slate-700/50 rounded-full flex items-center justify-center mx-auto text-slate-400 mb-2">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <p class="text-sm font-semibold text-slate-300">All Collections Cleared</p>
        <p class="text-xs text-slate-500 mt-1">Tap the sync button above to fetch new assignments.</p>
      </div>
    </template>

    <!-- Recovery Cards Loop (AGNT-01) -->
    <div class="space-y-3">
      <template x-for="item in filteredList" :key="item.installment.id">
        <div class="bg-slate-800 border border-slate-700/70 rounded-2xl p-4 shadow-sm relative overflow-hidden transition hover:border-slate-600">
          
          <!-- Overdue Warning Badge -->
          <template x-if="item.installment.status === 'overdue'">
            <div class="absolute top-0 right-0 bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-bl-lg">
              OVERDUE
            </div>
          </template>

          <div class="flex justify-between items-start pr-12">
            <div>
              <h4 class="font-bold text-white text-sm" x-text="item.subscription.customer_name || 'Subscriber'"></h4>
              <p class="text-xs text-slate-400 mt-0.5 flex items-center space-x-1">
                <span class="font-mono text-amber-400" x-text="item.subscription.booking_code"></span>
                <span>•</span>
                <span x-text="item.package.title || 'Bus Tour'"></span>
              </p>
            </div>
          </div>

          <!-- Contact Action Buttons -->
          <div class="flex items-center space-x-2 mt-2.5">
            <a :href="'tel:' + item.subscription.customer_phone" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs text-slate-300 flex items-center space-x-1">
              <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
              </svg>
              <span x-text="item.subscription.customer_phone"></span>
            </a>
          </div>

          <!-- Divider & Collection Bar -->
          <div class="mt-3 pt-3 border-t border-slate-700 flex items-center justify-between">
            <div>
              <span class="text-[11px] text-slate-400">EMI <span x-text="'#' + item.installment.installment_no"></span></span>
              <p class="text-lg font-extrabold text-white" x-text="'₹ ' + Number(item.installment.amount).toLocaleString('en-IN')"></p>
            </div>

            <!-- Collect Button (AGNT-01) -->
            <button @click="openCollectModal(item)"
                    class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs rounded-xl shadow transition active:scale-95 flex items-center space-x-1.5">
              <span>Collect EMI</span>
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
              </svg>
            </button>
          </div>
        </div>
      </template>
    </div>
  </main>

  <!-- Modal 1: Collect EMI Modal (AGNT-02) -->
  <div x-show="collectModalOpen" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4"
       x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
    <div @click.away="collectModalOpen = false" class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 text-slate-100 shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b border-slate-700">
        <div>
          <h3 class="font-bold text-base text-white">Record Collection</h3>
          <p class="text-xs text-slate-400" x-text="activeItem ? activeItem.subscription.customer_name : ''"></p>
        </div>
        <button @click="collectModalOpen = false" class="text-slate-400 hover:text-white p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="py-4 space-y-4">
        <div class="bg-slate-900 rounded-xl p-3 border border-slate-700 text-center">
          <span class="text-xs text-slate-400">Total Collection Amount</span>
          <p class="text-2xl font-black text-amber-400 mt-0.5" x-text="activeItem ? '₹ ' + Number(activeItem.installment.amount).toLocaleString('en-IN') : ''"></p>
        </div>

        <!-- Payment Mode Select (AGNT-02) -->
        <div>
          <label class="text-xs font-semibold text-slate-300 mb-1.5 block">Payment Mode</label>
          <div class="grid grid-cols-2 gap-2">
            <button @click="paymentMode = 'cash'" type="button"
                    :class="paymentMode === 'cash' ? 'bg-amber-600 text-white font-bold border-amber-500' : 'bg-slate-700 text-slate-300 border-transparent'"
                    class="py-2.5 rounded-xl text-xs border flex items-center justify-center space-x-1.5 transition">
              <span>Cash</span>
            </button>
            <button @click="paymentMode = 'upi'" type="button"
                    :class="paymentMode === 'upi' ? 'bg-amber-600 text-white font-bold border-amber-500' : 'bg-slate-700 text-slate-300 border-transparent'"
                    class="py-2.5 rounded-xl text-xs border flex items-center justify-center space-x-1.5 transition">
              <span>UPI / QR</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Action -->
      <button @click="confirmCollection()" :disabled="isSaving"
              class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-sm rounded-xl shadow transition active:scale-98 flex items-center justify-center space-x-2">
        <span x-text="isSaving ? 'Processing...' : 'Confirm & Generate Receipt'"></span>
      </button>
    </div>
  </div>

  <!-- Modal 2: Thermal Receipt Modal (AGNT-04) -->
  <div x-show="receiptModalOpen" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"
       x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
    <div @click.away="receiptModalOpen = false" class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 text-slate-100 shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b border-slate-700 mb-3">
        <h3 class="font-bold text-sm text-white">Payment Receipt</h3>
        <button @click="receiptModalOpen = false" class="text-slate-400 hover:text-white p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <!-- Printable Monospaced Receipt Preview (AGNT-04) -->
      <div id="printable-receipt" class="bg-white text-black p-3.5 rounded-xl font-mono text-[11px] leading-relaxed shadow-inner overflow-x-auto select-text whitespace-pre">
        <span x-text="receiptText"></span>
      </div>

      <!-- Buttons -->
      <div class="grid grid-cols-2 gap-2 mt-4">
        <button @click="window.print()" class="py-2.5 bg-slate-700 hover:bg-slate-600 text-white font-semibold text-xs rounded-xl transition flex items-center justify-center space-x-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
          <span>Print Slip</span>
        </button>
        <a :href="whatsAppUrl" target="_blank" class="py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs rounded-xl transition flex items-center justify-center space-x-1">
          <span>WhatsApp</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Modal 3: Handover Initiation & OTP Modal (AGNT-05, API-03) -->
  <div x-show="handoverModalOpen" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div @click.away="handoverModalOpen = false" class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 text-slate-100 shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b border-slate-700 mb-3">
        <h3 class="font-bold text-sm text-white">Distributor Cash Handover</h3>
        <button @click="handoverModalOpen = false" class="text-slate-400 hover:text-white p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <template x-if="!handoverOtp">
        <div class="space-y-4 py-2">
          <p class="text-xs text-slate-300">You are about to transfer all cash currently in your custody to your assigned distributor.</p>
          <div class="bg-slate-900 rounded-xl p-3.5 border border-slate-700 text-center">
            <span class="text-xs text-slate-400">Total Physical Cash</span>
            <p class="text-2xl font-black text-amber-400 mt-1" x-text="'₹ ' + Number(cashInHand).toLocaleString('en-IN')"></p>
          </div>
          <button @click="initiateHandover()" :disabled="isHandingOver"
                  class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs rounded-xl shadow transition">
            <span x-text="isHandingOver ? 'Generating OTP...' : 'Generate Handover OTP'"></span>
          </button>
        </div>
      </template>

      <!-- OTP Display Step (API-03) -->
      <template x-if="handoverOtp">
        <div class="space-y-4 py-2 text-center">
          <p class="text-xs text-slate-300">Show this 4-digit verification OTP to your distributor:</p>
          <div class="bg-amber-950/70 border border-amber-500/80 rounded-2xl p-4">
            <span class="text-[11px] uppercase tracking-widest text-amber-300 font-bold">Verification OTP</span>
            <p class="text-4xl font-black font-mono text-amber-400 tracking-widest mt-1" x-text="handoverOtp"></p>
          </div>
          <p class="text-[11px] text-slate-400">The distributor must enter this OTP in their dashboard to confirm physical cash receipt.</p>
          <button @click="handoverModalOpen = false; handoverOtp = ''" class="w-full py-2.5 bg-slate-700 text-white font-semibold text-xs rounded-xl">
            Close
          </button>
        </div>
      </template>
    </div>
  </div>

  <!-- Application Logic -->
  <script>
    function agentApp() {
      return {
        isOnline: navigator.onLine,
        isSyncing: false,
        isSaving: false,
        isHandingOver: false,
        pendingSyncCount: 0,
        cashInHand: 0,
        cashCollectionsCount: 0,
        agentName: "",
        agentId: "",
        recoveryList: [],
        searchQuery: "",
        collectModalOpen: false,
        receiptModalOpen: false,
        handoverModalOpen: false,
        activeItem: null,
        paymentMode: "cash",
        receiptText: "",
        whatsAppUrl: "",
        handoverOtp: "",

        get filteredList() {
          if (!this.searchQuery) return this.recoveryList;
          const q = this.searchQuery.toLowerCase();
          return this.recoveryList.filter(i => 
            (i.subscription.customer_name && i.subscription.customer_name.toLowerCase().includes(q)) ||
            (i.subscription.customer_phone && i.subscription.customer_phone.includes(q)) ||
            (i.subscription.booking_code && i.subscription.booking_code.toLowerCase().includes(q))
          );
        },

        async initApp() {
          window.addEventListener("online", () => { this.isOnline = true; this.flushOutbox(); });
          window.addEventListener("offline", () => { this.isOnline = false; });

          // Register Service Worker (PWA-02)
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js").then(() => {
              console.log("Service Worker registered");
            });
            navigator.serviceWorker.addEventListener("message", (event) => {
              if (event.data && event.data.type === "BACKGROUND_SYNC_TRIGGER") {
                this.flushOutbox();
              }
            });
          }

          // Initial hydrate from local Dexie store
          await this.loadLocalData();

          // If online, perform morning manifest sync
          if (this.isOnline) {
            await this.syncData();
          }
        },

        async loadLocalData() {
          this.recoveryList = await window.BharatYatraStore.getDailyRecoveryList();
          this.cashInHand = await window.BharatYatraStore.getCashInHandTotal();
          const outbox = await window.BharatYatraStore.getPendingOutbox();
          this.pendingSyncCount = outbox.length;
          const db = window.BharatYatraStore.getDB();
          const cashPaid = await db.installments.filter(i => i.status === "paid" && i.payment_mode === "cash" && i.handover_status === "agent_custody").toArray();
          this.cashCollectionsCount = cashPaid.length;
        },

        async syncData() {
          this.isSyncing = true;
          try {
            const token = localStorage.getItem("by_auth_token") || "";
            const res = await fetch("/api/agent/sync-manifest", {
              headers: { "Authorization": token ? "Bearer " + token : "" }
            });
            if (res.ok) {
              const data = await res.json();
              if (data.agent) {
                this.agentName = data.agent.name;
                this.agentId = data.agent.id;
              }
              await window.BharatYatraStore.syncManifestDown(data);
              await this.loadLocalData();
            }
          } catch (e) {
            console.warn("Sync failed, continuing with offline cache:", e);
          } finally {
            this.isSyncing = false;
          }
        },

        openCollectModal(item) {
          this.activeItem = item;
          this.paymentMode = "cash";
          this.collectModalOpen = true;
        },

        async confirmCollection() {
          if (!this.activeItem) return;
          this.isSaving = true;
          try {
            const result = await window.BharatYatraStore.recordOfflinePayment({
              installmentId: this.activeItem.installment.id,
              subscriptionId: this.activeItem.subscription.id,
              paymentMode: this.paymentMode,
              amount: this.activeItem.installment.amount,
              agentId: this.agentId || "AGENT",
              customerPhone: this.activeItem.subscription.customer_phone,
              customerName: this.activeItem.subscription.customer_name,
              bookingCode: this.activeItem.subscription.booking_code
            });

            // Generate receipt text & WhatsApp share URL (AGNT-04)
            const receiptPayload = {
              receipt_slip_id: result.receiptSlipId,
              customer_name: this.activeItem.subscription.customer_name,
              customer_phone: this.activeItem.subscription.customer_phone,
              booking_code: this.activeItem.subscription.booking_code,
              package_title: this.activeItem.package.title,
              installment_no: this.activeItem.installment.installment_no,
              tenure_months: this.activeItem.subscription.tenure_months,
              amount: this.activeItem.installment.amount,
              payment_mode: this.paymentMode,
              status: "PAID",
              agent_name: this.agentName || "Agent"
            };

            this.receiptText = window.BharatYatraReceipt.formatThermalReceiptText(receiptPayload);
            this.whatsAppUrl = window.BharatYatraReceipt.generateWhatsAppShareUrl(receiptPayload);

            this.collectModalOpen = false;
            this.receiptModalOpen = true;

            await this.loadLocalData();

            // Attempt online flush if connected
            if (this.isOnline) {
              this.flushOutbox();
            }
          } catch (e) {
            alert("Error recording collection: " + e.message);
          } finally {
            this.isSaving = false;
          }
        },

        async flushOutbox() {
          const outbox = await window.BharatYatraStore.getPendingOutbox();
          if (outbox.length === 0) return;

          const token = localStorage.getItem("by_auth_token") || "";
          try {
            const res = await fetch("/api/agent/batch-sync", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": token ? "Bearer " + token : ""
              },
              body: JSON.stringify({ items: outbox })
            });

            if (res.ok) {
              for (const item of outbox) {
                await window.BharatYatraStore.markOutboxSynced(item.idempotency_key);
              }
              await this.loadLocalData();
            }
          } catch (e) {
            console.warn("Outbox flush will retry:", e);
          }
        },

        openHandoverModal() {
          this.handoverOtp = "";
          this.handoverModalOpen = true;
        },

        async initiateHandover() {
          this.isHandingOver = true;
          try {
            const token = localStorage.getItem("by_auth_token") || "";
            const res = await fetch("/api/handover/initiate", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": token ? "Bearer " + token : ""
              }
            });

            if (res.ok) {
              const data = await res.json();
              this.handoverOtp = data.otp_code;
            } else {
              const err = await res.json();
              alert(err.error || "Failed to initiate handover");
            }
          } catch (e) {
            alert("Network error: Handover initiation requires connectivity to generate OTP.");
          } finally {
            this.isHandingOver = false;
          }
        }
      };
    }
  </script>
</body>
</html>
