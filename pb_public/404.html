<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — BharatYatra</title>
  <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml">
  <meta name="theme-color" content="#D97706">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(1200px 600px at 50% -10%, #241a08 0%, #0b0d12 55%, #07080b 100%);
      color: #e2e8f0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 460px;
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(217, 119, 6, 0.35);
      border-radius: 24px;
      padding: 40px 28px;
      box-shadow: 0 25px 60px -20px rgba(217, 119, 6, 0.25);
    }
    .mark {
      width: 56px; height: 56px; margin: 0 auto 18px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 18px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #111; font-weight: 900; font-size: 20px;
    }
    .code { font-size: 64px; font-weight: 900; color: #f59e0b; line-height: 1; }
    h1 { font-size: 22px; font-weight: 800; margin: 10px 0 8px; color: #fff; }
    p { font-size: 13px; color: #94a3b8; line-height: 1.6; }
    .actions { margin-top: 26px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block; text-decoration: none; font-size: 13px; font-weight: 800;
      padding: 12px 20px; border-radius: 14px; transition: filter .15s ease;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn-primary { background: linear-gradient(90deg, #f59e0b, #d97706); color: #111; }
    .btn-ghost { border: 1px solid #334155; color: #cbd5e1; }
    .foot { margin-top: 24px; font-size: 11px; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">BY</div>
    <div class="code">404</div>
    <h1>This road doesn't exist</h1>
    <p>The page you were looking for has moved, ended, or never existed. Your journey continues from the landing page.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Back to Home</a>
      <a class="btn btn-ghost" href="/agent/dashboard">Agent Login</a>
      <a class="btn btn-ghost" href="/#packages">Tour Packages</a>
    </div>
    <div class="foot">BharatYatra Micro-Collection Network • Offline-first EMI travel</div>
  </div>
</body>
</html>
